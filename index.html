    // ----- RENDER GRID -----
    function renderOrganGrid(filter = '') {
      const q = filter.toLowerCase().trim();
      let filtered = allOrgans;
      if (q) {
        filtered = allOrgans.filter(o => {
          const name = currentLang === 'bn' ? o.nameBn : o.nameEn;
          return name.toLowerCase().includes(q);
        });
      }
      grid.innerHTML = '';
      filtered.forEach(org => {
        const card = document.createElement('div');
        card.className = 'organ-card';
        const displayName = currentLang === 'bn' ? org.nameBn : org.nameEn;
        card.innerHTML = `<i class="${org.icon}"></i><span>${displayName}</span>`;
        card.dataset.id = org.id;
        card.addEventListener('click', () => openDetail(org.id));
        grid.appendChild(card);
      });
      if (filtered.length === 0) {

      }
    }
